concept_code: scalar_subquery
concept_name: Skalarni podupit
module_number: 5
module_name: Podupiti
tier: medium
target_misconceptions:
- code: subquery_returns_multiple_rows
  description: Student napiše skalarni podupit koji može vratiti više od 1 reda —
    runtime error 'more than one row returned by a subquery used as an expression'
  priority: critical
- code: subquery_returns_multiple_columns
  description: Student napiše podupit koji SELECT-a više od jedne kolone u skalarnom
    kontekstu — PostgreSQL vraća grešku jer se očekuje točno 1 stupac
  priority: critical
- code: scalar_vs_correlated_confusion
  description: Student napiše korelirani podupit tamo gdje je potreban nekorelirani
    skalarni podupit (ili obrnuto) — semantički krivi rezultat bez greške
  priority: high
- code: missing_aggregate_in_scalar
  description: Student zaboravi agregacijsku funkciju (npr. MAX, AVG) u skalarnom
    podupitu — bez GROUP BY podupit vraća sve redove umjesto jedne vrijednosti
  priority: high
- code: scalar_in_wrong_clause
  description: Student pokušava koristiti skalarni podupit u FROM klauzi bez aliasa
    — sintaksna greška jer se FROM podupit mora aliasirati
  priority: medium
domain_hints:
- Skalarni podupit mora vraćati točno 1 red × 1 stupac — uvijek koristi agregacijske
  funkcije (MAX, MIN, AVG, COUNT, SUM) ili LIMIT 1 u unutarnjem upitu
- 'Sandbox ecommerce_v1: usporedi total_amount narudžbi s prosječnim (AVG) ili maksimalnim
  (MAX) iznosom svih narudžbi'
- 'Tipični scenarij u SELECT klauzi: svaki red dobiva isti skalarni rezultat (npr.
  globalni prosjek) kao dodatni stupac za usporedbu'
- 'Tipični scenarij u WHERE klauzi: WHERE total_amount > (SELECT AVG(total_amount)
  FROM orders) — filtrira narudžbe iznad globalnog prosjeka'
- 'Tipični scenarij u HAVING klauzi: HAVING SUM(quantity) > (SELECT AVG(...) FROM
  ...) — filtrira grupe prema skalarnoj referentnoj vrijednosti'
- Sandbox ima ~1000 narudžbi i ~3000 stavki narudžbe — usporedbe s globalnim prosjecima
  i MAX/MIN vrijednostima su prirodni slučajevi korištenja
- products.price je dobar kandidat za MAX/MIN skalarni podupit; orders.total_amount
  za AVG skalarni podupit
anti_patterns:
- Ne piši skalarni podupit bez agregacijske funkcije ili LIMIT 1 — može returnati
  više redova i uzrokovati runtime error
- Ne SELECT-aj više od jedne kolone unutar skalarnog podupita — uvijek točno jedna
  kolona u SELECT listi inner upita
- Ne koristi skalarni podupit u FROM klauzi bez aliasa — ako je potreban podupit u
  FROM-u, mora se aliasirati (ali to je derived table, ne scalar subquery)
- Ne miješaj skalarni i korelirani podupit u istom primjeru bez jasne distinkcije
  — student treba razumjeti da skalarni podupit ne referencira outer tablicu
- expected_query ne smije koristiti SELECT * unutar skalarnog podupita — uvijek eksplicitna
  jedna kolona
required_for_high_difficulty:
- Skalarni podupit mora biti prisutan u barem dvije različite klauze (npr. SELECT
  + WHERE ili WHERE + HAVING)
- Kombinacija skalarnog podupita s JOIN-om i GROUP BY za složenije filtriranje
- Skalarni podupit koji koristi agregaciju nad poduputom koji sam agregira (nested
  aggregation pattern)
few_shot_examples:
- difficulty: 2
  title: Narudžbe iznad globalnog prosjeka
  description: 'Pronađi sve narudžbe čiji je total_amount veći od globalnog prosjeka
    svih narudžbi.

    Ispiši id, customer_id, total_amount i status.

    Sortiraj po total_amount silazno.'
  expected_query: 'SELECT id, customer_id, total_amount, status

    FROM orders

    WHERE total_amount > (SELECT AVG(total_amount) FROM orders)

    ORDER BY total_amount DESC

    LIMIT 20;'
  expected_concepts:
  - scalar_subquery
  - where_filter
  - order_by
  - limit_offset
  targets_misconception: missing_aggregate_in_scalar
- difficulty: 2
  title: Najskuplji proizvod u katalogu
  description: 'Ispiši sve podatke o proizvodu koji ima najvišu cijenu (price) u tablici
    products.

    Koristi skalarni podupit u WHERE klauzi koji dohvaća MAX(price).'
  expected_query: 'SELECT id, name, price, category_id

    FROM products

    WHERE price = (SELECT MAX(price) FROM products);'
  expected_concepts:
  - scalar_subquery
  - where_filter
  - select_basic
  targets_misconception: subquery_returns_multiple_rows
- difficulty: 3
  title: TOP 3 proizvoda iznad globalnog prosjeka cijena
  description: 'Pronađi tri proizvoda s najvišom cijenom među onima čija je cijena
    veća od globalnog prosjeka cijena svih proizvoda.

    Ispiši id, name i price, sortirano od najveće cijene prema najmanjoj.

    Koristi skalarni podupit u WHERE klauzi koji vraća AVG(price).'
  expected_query: 'SELECT id, name, price

    FROM products

    WHERE price > (SELECT AVG(price) FROM products)

    ORDER BY price DESC

    LIMIT 3;'
  expected_concepts:
  - scalar_subquery
  - where_filter
  - order_by
  targets_misconception: missing_aggregate_in_scalar
- difficulty: 3
  title: Globalni prosjek kao referentni stupac
  description: 'Za svaku narudžbu ispiši id, total_amount i globalni prosjek svih
    narudžbi kao dodatni stupac avg_all_orders.

    Tako student može vizualno usporediti svaku narudžbu s globalnim prosjekom.

    Koristi skalarni podupit u SELECT klauzi.'
  expected_query: "SELECT\n    id,\n    total_amount,\n    ROUND((SELECT AVG(total_amount)\
    \ FROM orders)::NUMERIC, 2) AS avg_all_orders,\n    ROUND(total_amount - (SELECT\
    \ AVG(total_amount) FROM orders)::NUMERIC, 2) AS diff_from_avg\nFROM orders\n\
    ORDER BY diff_from_avg DESC\nLIMIT 15;"
  expected_concepts:
  - scalar_subquery
  - select_basic
  - column_alias
  - order_by
  targets_misconception: scalar_in_wrong_clause
- difficulty: 3
  title: Kategorije s prosječnom cijenom iznad globalnog prosjeka
  description: 'Pronađi sve kategorije proizvoda čija je prosječna cijena (AVG price)
    viša od globalnog prosjeka cijena svih proizvoda.

    Ispiši category_id i avg_price.

    Koristi skalarni podupit u HAVING klauzi.'
  expected_query: "SELECT\n    cat.id AS category_id,\n    cat.name AS category_name,\n\
    \    ROUND(AVG(p.price)::NUMERIC, 2) AS avg_price\nFROM products p\nINNER JOIN\
    \ categories cat ON p.category_id = cat.id\nGROUP BY cat.id, cat.name\nHAVING\
    \ AVG(p.price) > (SELECT AVG(price) FROM products)\nORDER BY avg_price DESC;"
  expected_concepts:
  - scalar_subquery
  - having_filter
  - group_by
  - aggregate_functions
  - inner_join
  targets_misconception: missing_aggregate_in_scalar
- difficulty: 4
  title: Kupci čiji je ukupni iznos narudžbi iznad globalnog prosjeka po kupcu
  description: 'Pronađi kupce čiji je ukupni iznos svih narudžbi (SUM total_amount)
    veći od prosječnog ukupnog iznosa po kupcu.

    Ispiši customer_id, first_name, last_name i total_spent.

    Koristi skalarni podupit u HAVING klauzi koji računa prosječni total po kupcu.'
  expected_query: "SELECT\n    c.id AS customer_id,\n    c.first_name,\n    c.last_name,\n\
    \    SUM(o.total_amount) AS total_spent\nFROM customers c\nINNER JOIN orders o\
    \ ON c.id = o.customer_id\nGROUP BY c.id, c.first_name, c.last_name\nHAVING SUM(o.total_amount)\
    \ > (\n    SELECT AVG(customer_total)\n    FROM (\n        SELECT SUM(total_amount)\
    \ AS customer_total\n        FROM orders\n        GROUP BY customer_id\n    )\
    \ AS per_customer\n)\nORDER BY total_spent DESC;"
  expected_concepts:
  - scalar_subquery
  - having_filter
  - group_by
  - aggregate_functions
  - inner_join
  - derived_table
  targets_misconception: scalar_vs_correlated_confusion
- difficulty: 5
  title: Proizvodi s cijenom između MIN i prosječne cijene kategorije
  description: 'Pronađi sve proizvode čija je cijena između globalne minimalne cijene
    i globalnog prosjeka cijena svih proizvoda.

    Ispiši name, price, i razliku od globalnog prosjeka (diff_from_avg).

    Koristi skalarni podupit u SELECT i WHERE klauzi (dva različita skalarni podupita).'
  expected_query: "SELECT\n    p.name,\n    p.price,\n    ROUND((p.price - (SELECT\
    \ AVG(price) FROM products))::NUMERIC, 2) AS diff_from_avg,\n    (SELECT MIN(price)\
    \ FROM products) AS global_min,\n    ROUND((SELECT AVG(price) FROM products)::NUMERIC,\
    \ 2) AS global_avg\nFROM products p\nWHERE p.price BETWEEN (SELECT MIN(price)\
    \ FROM products)\n                  AND (SELECT AVG(price) FROM products)\nORDER\
    \ BY p.price DESC;"
  expected_concepts:
  - scalar_subquery
  - where_filter
  - select_basic
  - column_alias
  - order_by
  targets_misconception: subquery_returns_multiple_columns
ast_validation_rules:
- expected_query mora sadržavati barem jedan podupit (SELECT unutar zagrada) u SELECT,
  WHERE ili HAVING klauzi
- Svaki skalarni podupit unutar SELECT/WHERE/HAVING mora imati točno jednu kolonu
  u svojoj SELECT listi (ne SELECT *)
- Skalarni podupit u WHERE ili HAVING klauzi mora sadržavati agregacijsku funkciju
  (MAX, MIN, AVG, SUM, COUNT) ili LIMIT 1 kako bi se garantiralo vraćanje jednog reda
- Skalarni podupit ne smije referencirati alias outer tablice u svojoj WHERE klauzi
  — to bi ga učinilo koreliranim podupitom (korelirani podupit je zaseban koncept)
- 'Za težinu >= 4: expected_query mora koristiti skalarni podupit u barem jednoj od:
  SELECT lista, HAVING klauza, ili ugniježđen kao argument agregacijske funkcije'
