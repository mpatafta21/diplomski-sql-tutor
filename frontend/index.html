<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080817" />

    <!--
      Preload display fonta (Faza 4.7-r2). Samo `latin` + `latin-ext` osi `wght` —
      `vietnamese` se nikad ne dohvaća, a `latin-ext` DA jer ondje žive hrvatski
      `č ć ž š đ` (latin pokriva samo U+0000-00FF).
      Vite prepisuje `href` u hashirani asset pri buildu; putanja je izvorna.
      ⚠️ `crossorigin` je OBAVEZAN i za isti origin — bez njega preglednik dohvati
      font DVAPUT (jednom kao preload, jednom kao font), pa preload odmaže.
      🔴 Nula CDN-a: ovo su lokalni npm assetovi, ne vanjski host.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-wght-normal.woff2"
    />

    <title>SQL Tutor — adaptivno vježbanje SQL-a</title>
    <meta
      name="description"
      content="Vježbaj SQL uz zadatke prilagođene tvojoj razini znanja i praćenje napretka po konceptu. Sustav izrađen za diplomski rad na Fakultetu organizacije i informatike."
    />

    <!--
      Open Graph: link se sudionicima šalje mailom/chatom, a prvi kontakt je
      često PREVIEW poveznice — prije ijednog piksela aplikacije. Bez ovoga
      preview pokazuje golu domenu, što se čita kao slomljen build ili phishing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SQL Tutor — adaptivno vježbanje SQL-a" />
    <meta
      property="og:description"
      content="Vježbaj SQL uz zadatke prilagođene tvojoj razini znanja. Dio diplomskog rada na Fakultetu organizacije i informatike."
    />
    <!--
      og:image je PNG, ne SVG: Slack/Facebook/iMessage NE renderiraju SVG kao
      og:image, pa bi SVG bio isto što i nemati sliku. Izvor je
      `public/og-image.svg` (verzioniran uz PNG da se može ponovno rasterizirati);
      PNG je 1200×630 renderiran chrome-headless-shellom.
      Glyph je lucide `Database` — isti brand mark kao favicon i AppShell.
      Bez logotipa FOI-ja.
      ⚠️ `og:image` mora biti ABSOLUTNA URL da bi je scraper dohvatio. Domena je
      poznata tek pri deployu → popuniti prije objave linka sudionicima.
    -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SQL Tutor — adaptivno vježbanje SQL-a"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
