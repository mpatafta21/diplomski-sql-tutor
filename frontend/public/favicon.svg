<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Favicon (Faza 4.7-1a) — zamjenjuje Vite default (ljubičasta munja).
    Glyph je lucide `Database`, ISTI brand mark koji AppShell već koristi u
    sidebaru i mobilnom headeru — nije izmišljen branding, nema logotipa FOI-ja.
    Boje su IZRAČUNATE iz tokena (oklch→sRGB), ne pogođene:
      #f0b135 = --accent-warm  dark  oklch(0.80 0.15 80)
      #0a0a0a = --background   dark  oklch(0.145 0 0)
    Podloga je fiksno dark: favicon živi u chromeu preglednika, ne na stranici,
    pa ne može pratiti temu — dark je čitljiv u oba slučaja.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <g transform="translate(4 4)" fill="none" stroke="#f0b135" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5V19A9 3 0 0 0 21 19V5"/>
    <path d="M3 12A9 3 0 0 0 21 12"/>
  </g>
</svg>
